[project]
name = "grantloom"
version = "0.1.0"
description = "AI Agent-Based Grant Intelligence & Decision Support System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.35",
    "chromadb>=0.5.0",
    "kuzu>=0.8.0",
    "openpyxl>=3.1.5",
    "pypdf>=5.0.0",
    "reportlab>=4.2.5",
    "httpx>=0.27.2",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11.4",
    "lingua-language-detector>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pyflakes>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
